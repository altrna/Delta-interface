<!DOCTYPE html>
<html>
<head>
    <title>Real-time Predictions</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ddd;
        }
        h1 {
            color: #f0f0f0;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        button {
            padding: 14px 28px;
            font-size: 18px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s, opacity 0.3s;
        }
        #startButton {
            background-color: #218838;
        }
        #startButton:disabled {
            background-color: #218838;
            opacity: 0.5;
            cursor: not-allowed;
        }
        #stopButton {
            background-color: #c82333;
        }
        #stopButton:disabled {
            background-color: #c82333;
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: red;
            transition: background-color 0.3s;
            border: 2px solid #444;
        }
        #predictions {
            width: 70%;
            margin-top: 20px;
            padding: 20px;
            border-radius: 6px;
            background-color: #2d2d2d;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
        }
        .prediction-item {
            padding: 12px;
            margin-bottom: 10px;
            border-bottom: 1px solid #555;
            color: #ccc;
            background: #3a3a3a;
            border-radius: 5px;
        }
        .prediction-item.predicted-anomaly {
            background-color: #8b0000;
            color: #fff;
        }
        .wrong-btn {
            background-color: #ff5733;
            padding: 8px 14px;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 10px;
        }
        .wrong-btn:hover {
            background-color: #c70039;
        }
    </style>
    <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var socket = io.connect('http://' + document.domain + ':' + location.port);
        var isStreaming = false;

        function updateUI() {
            document.getElementById('startButton').disabled = isStreaming;
            document.getElementById('stopButton').disabled = !isStreaming;
            document.getElementById('statusIndicator').style.backgroundColor = isStreaming ? 'green' : 'red';
        }

        socket.on('connect', function() {
            console.log('Websocket connected!');
        });

        document.getElementById('startButton').addEventListener('click', function() {
            socket.emit('start_streaming', {});
            isStreaming = true;
            updateUI();
        });

        document.getElementById('stopButton').addEventListener('click', function() {
            socket.emit('stop_streaming', {});
            isStreaming = false;
            updateUI();
        });

        socket.on('update_predictions', function(predictions) {
            var predictionsElement = document.getElementById('predictions');
            predictionsElement.innerHTML = ''; // Clear existing predictions
            predictions.slice(-5).reverse().forEach(function(pred) {
                var newPred = document.createElement('div');
                newPred.classList.add('prediction-item');
                if (pred.result) {
                    newPred.classList.add('predicted-anomaly');
                }
                var date = new Date(pred.timestamp * 1000);
                newPred.innerHTML = date.toLocaleTimeString() + ' - Process ID: ' + pred.id + ' - Result: ' + pred.result + ' - Length: ' + pred.series_len +
                    ' <button class="wrong-btn" onclick="markAsWrong(\'' + pred.id + '\', \'' + pred.result + '\')">Mark as Wrong</button>';
                predictionsElement.appendChild(newPred);
            });
        });

        window.markAsWrong = function(predictionId, prediction) {
            socket.emit('wrong_prediction', { id: predictionId, prediction_res: prediction });
        }

        updateUI();
    });
    </script>
</head>
<body>
    <h1>Real-time Anomaly Detection</h1>
    <div class="button-container">
        <button id="startButton">Start Streaming</button>
        <button id="stopButton">Stop Streaming</button>
        <div id="statusIndicator" class="status-indicator"></div>
    </div>
    <div id="predictions">
        <h2>Predictions:</h2>
    </div>
</body>
</html>
